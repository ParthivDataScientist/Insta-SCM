<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insta Exhibitions — Truck Logistics Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#0b2545; --navy2:#13315c; --blue:#1d6fb8; --blue-soft:#e8f1fa;
    --teal:#0f6e56; --teal-soft:#e3f3ee; --ink:#1b2733; --muted:#6b7a8d;
    --line:#e2e8f0; --line2:#eef2f7; --bg:#f5f7fa; --white:#fff;
    --amber-soft:#fdf2dd; --amber-ink:#8a5a00; --red:#c0392b; --green:#1e7a4d; --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Inter',sans-serif; color:var(--ink); min-height:100vh; background:var(--bg);}

  /* LOGIN */
  #loginScreen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    background:radial-gradient(900px 500px at 15% -10%, #173a6b 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 110%, #0f6e56 0%, transparent 55%),
      linear-gradient(160deg,#0b2545,#13315c);}
  .login{width:100%; max-width:400px; background:var(--white); border-radius:16px; box-shadow:0 30px 80px rgba(0,0,0,.4); overflow:hidden; animation:rise .5s ease both;}
  .login .top{padding:30px 32px 22px; text-align:center; border-bottom:1px solid var(--line2);}
  .login .logo{width:78px; height:78px; margin:0 auto 14px; border-radius:18px; background:#fff; border:1px solid var(--line); padding:8px; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px rgba(13,37,69,.12);}
  .login .logo img{width:100%; height:100%; object-fit:contain;}
  .login h1{font-family:'Sora',sans-serif; font-size:19px; font-weight:700; color:var(--navy); letter-spacing:-.3px;}
  .login .sub{font-size:12.5px; color:var(--muted); margin-top:3px; font-weight:500;}
  .login .body{padding:26px 32px 30px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--navy2); margin-bottom:7px;}
  .field input{width:100%; border:1px solid var(--line); border-radius:11px; padding:12px 13px; font-family:'Inter',sans-serif; font-size:14px; color:var(--ink); background:#fcfdfe; outline:none; transition:border-color .15s, box-shadow .15s;}
  .field input:focus{border-color:var(--blue); box-shadow:0 0 0 3px rgba(29,111,184,.15); background:#fff;}
  .btn-login{width:100%; margin-top:6px; cursor:pointer; border:none; border-radius:11px; padding:13px; font-family:'Sora',sans-serif; font-weight:600; font-size:14px; color:#fff; background:linear-gradient(145deg,var(--blue),var(--navy2)); box-shadow:0 6px 18px rgba(29,111,184,.32); transition:transform .15s;}
  .btn-login:hover{transform:translateY(-1px);}
  .err{display:none; margin-top:12px; font-size:12px; font-weight:600; color:var(--red); text-align:center;}
  .hint{margin-top:18px; padding-top:16px; border-top:1px dashed var(--line); font-size:11px; color:var(--muted); line-height:1.7;}
  .hint b{color:var(--navy2);}
  .login .footer{padding:14px; text-align:center; font-size:11px; color:var(--muted); background:#fafcfe; border-top:1px solid var(--line2);}

  /* APP */
  #appScreen{display:none;}
  .appbar{background:linear-gradient(180deg,var(--navy),var(--navy2)); color:#fff; padding:11px 20px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;}
  .appbar .who{display:flex; align-items:center; gap:12px;}
  .appbar .mini{width:42px; height:42px; border-radius:11px; background:#fff; padding:5px; display:flex; align-items:center; justify-content:center;}
  .appbar .mini img{width:100%; height:100%; object-fit:contain;}
  .appbar h2{font-family:'Sora',sans-serif; font-size:15px; font-weight:600;}
  .appbar .role{font-size:11.5px; color:#aec6e3;}
  .appbar .right{display:flex; align-items:center; gap:10px; font-size:12.5px; flex-wrap:wrap;}
  .clock{color:#aec6e3;}
  .btn{font-family:'Sora',sans-serif; cursor:pointer; border:none; border-radius:10px; padding:9px 15px; font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:7px; transition:transform .15s, box-shadow .15s;}
  .btn-export{background:linear-gradient(145deg,var(--teal),#0a5240); color:#fff; box-shadow:0 5px 16px rgba(15,110,86,.3);}
  .btn-export:hover{transform:translateY(-1px);}
  .logout{background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25); color:#fff;}
  .logout:hover{background:rgba(255,255,255,.24);}
  .stage{padding:22px; max-width:1340px; margin:0 auto;}

  .toolbar{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px;}
  .pill{background:var(--white); border:1px solid var(--line); border-radius:999px; padding:8px 14px; font-size:12px; font-weight:600; color:var(--navy2); display:flex; align-items:center; gap:7px;}
  .pill .dot{width:8px; height:8px; border-radius:50%; background:var(--teal);}
  .btn-clear{background:var(--white); color:var(--navy2); border:1px solid var(--line);}
  .btn-clear:hover{background:#eef2f7;}

  .card{background:var(--white); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:0 10px 40px rgba(13,37,69,.07); animation:fadeUp .4s ease both;}
  .scroll{overflow-x:auto;}
  table{border-collapse:separate; border-spacing:0; min-width:1480px; width:100%;}
  thead th{position:sticky; top:0; z-index:2; background:linear-gradient(180deg,var(--navy),var(--navy2)); color:#dce8f5; font-family:'Sora',sans-serif; font-weight:600; font-size:11px; letter-spacing:.5px; text-transform:uppercase; text-align:left; padding:13px 11px; white-space:nowrap;}
  thead th.center{text-align:center;}
  thead tr.filterrow th{position:sticky; top:43px; z-index:2; background:#11294a; padding:7px 8px; border-bottom:2px solid var(--blue); text-transform:none; letter-spacing:0;}
  thead tr.filterrow input, thead tr.filterrow select{width:100%; border:1px solid #c7d2e0; border-radius:7px; padding:6px 8px; font-family:'Inter',sans-serif; font-size:11.5px; background:#fff; color:#1b2733; outline:none;}
  thead tr.filterrow input::placeholder{color:#94a3b8;}
  thead tr.filterrow input:focus, thead tr.filterrow select:focus{border-color:var(--blue); box-shadow:0 0 0 2px rgba(29,111,184,.35);}
  tbody td{padding:10px 11px; border-bottom:1px solid var(--line2); vertical-align:top;}
  tbody tr.req-start td{border-top:2px solid #dbe5f0;}
  .reqgrp:hover td.reqcell{background:var(--blue-soft);}
  td.reqcell{background:#fafcfe;}
  .reqno{font-family:'Sora',sans-serif; font-weight:700; color:var(--blue); font-size:13px; white-space:nowrap;}
  .pm{font-weight:600; color:var(--navy2); white-space:nowrap;}
  .nowrap{white-space:nowrap;}
  .chip{display:inline-block; background:var(--blue-soft); color:var(--navy); font-weight:600; font-size:11px; padding:3px 9px; border-radius:7px; white-space:nowrap;}
  .qty{display:inline-flex; align-items:center; justify-content:center; min-width:26px; height:26px; background:var(--navy); color:#fff; font-family:'Sora',sans-serif; font-weight:700; font-size:12px; border-radius:8px; padding:0 7px;}
  .trucktag{font-family:'Sora',sans-serif; font-weight:600; color:var(--navy2); white-space:nowrap; display:flex; align-items:center; gap:6px;}
  .trucktag i{color:var(--blue); font-style:normal;}
  .tstatus{display:inline-block; font-size:9.5px; font-weight:700; padding:2px 7px; border-radius:6px; margin-top:5px; letter-spacing:.3px;}
  .tstatus.appr{background:#e7f6ee; color:var(--green);}
  .tstatus.wait{background:var(--amber-soft); color:var(--amber-ink);}
  .tstatus.draft{background:#eef2f7; color:var(--muted);}
  .vend{min-width:170px;}
  .vbox{border:1px solid var(--line); border-radius:10px; padding:8px; margin-bottom:6px; background:#fcfdfe;}
  .vbox:last-child{margin-bottom:0;}
  .vbox.lowest{border-color:#bfe3d4; background:var(--teal-soft);}
  .vbox.rec{border-color:#9fc4ea; background:var(--blue-soft);}
  .vbox.approved{border:2px solid var(--green); background:#e7f6ee;}
  .vbox .vn{font-size:12px; font-weight:600; color:var(--navy2);}
  .vbox .va{font-size:13px; font-family:'Sora',sans-serif; font-weight:600; color:var(--ink);}
  .vbox .vtag{font-size:10px; font-weight:600; margin-top:3px; display:inline-block;}
  .vtag.rec{color:var(--blue);} .vtag.low{color:var(--green);} .vtag.appr{color:var(--green);}
  .vinput input{width:100%; border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-size:12px; background:#fff; outline:none; margin-bottom:5px;}
  .vinput input:focus{border-color:var(--blue); box-shadow:0 0 0 2px rgba(29,111,184,.15);}
  .vinput .amtwrap{position:relative;}
  .vinput .amtwrap .cur{position:absolute; left:8px; top:7px; color:var(--muted); font-size:11px; font-weight:600;}
  .vinput .amtwrap input{padding-left:20px; margin-bottom:0;}
  .approve-btn{width:100%; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--navy2); border-radius:8px; padding:6px; font-family:'Sora',sans-serif; font-weight:600; font-size:11px; margin-top:5px;}
  .approve-btn:hover{background:var(--blue-soft); border-color:var(--blue);}
  .actcell{min-width:150px; text-align:center;}
  .send{width:100%; cursor:pointer; border:none; border-radius:10px; padding:10px 12px; font-family:'Sora',sans-serif; font-weight:600; font-size:12px; color:#fff; background:linear-gradient(145deg,var(--blue),var(--navy2)); box-shadow:0 4px 12px rgba(29,111,184,.28); transition:transform .15s; display:flex; align-items:center; justify-content:center; gap:7px;}
  .send:hover:not(:disabled){transform:translateY(-1px);}
  .send.waiting{background:#eef2f7; color:var(--muted); box-shadow:none; cursor:default;}
  .send.approved{background:linear-gradient(145deg,var(--green),#15603b); cursor:default;}
  .msg{margin-top:8px; font-size:10.5px; font-weight:600; color:var(--muted); line-height:1.4;}
  .msg.err{color:var(--red);} .msg.ok{color:var(--green);}
  .foot{padding:13px 16px; font-size:11.5px; color:var(--muted); border-top:1px solid var(--line2); background:#fafcfe; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .noresult{padding:30px; text-align:center; color:var(--muted); font-size:13px;}
  .panel{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:26px; box-shadow:0 10px 40px rgba(13,37,69,.07);}
  .panel h3{font-family:'Sora',sans-serif; font-size:17px; color:var(--navy); margin-bottom:6px;}
  .panel p{font-size:13px; color:var(--muted); line-height:1.6;}
  .tag{display:inline-block; margin-bottom:14px; font-size:11.5px; font-weight:600; padding:4px 11px; border-radius:999px;}
  .tag.pm{background:var(--blue-soft); color:var(--navy);}
  .pmform label{display:block; font-size:12px; font-weight:600; color:var(--navy2); margin-bottom:6px;}
  .pmform input, .pmform select, .pmform textarea{width:100%; border:1px solid var(--line); border-radius:9px; padding:9px 10px; font-family:'Inter',sans-serif; font-size:13px; color:var(--ink); background:#fcfdfe; outline:none;}
  .pmform input:focus, .pmform select:focus, .pmform textarea:focus{border-color:var(--blue); box-shadow:0 0 0 3px rgba(29,111,184,.14); background:#fff;}
  .pmgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:16px;}
  .pmtable{width:100%; border-collapse:separate; border-spacing:0; min-width:760px;}
  .pmtable th{background:var(--navy); color:#dce8f5; font-family:'Sora',sans-serif; font-weight:600; font-size:10.5px; letter-spacing:.4px; text-transform:uppercase; text-align:left; padding:9px 8px; white-space:nowrap;}
  .pmtable td{padding:5px; border-bottom:1px solid var(--line2); vertical-align:top;}
  .pmtable input, .pmtable select{margin-bottom:0; font-size:12px; padding:7px 8px;}
  .pmtable .srno{text-align:center; font-weight:700; color:var(--blue); font-family:'Sora',sans-serif;}
  .addrow{background:#fff; color:var(--navy2); border:1px dashed var(--blue); border-radius:9px; padding:8px 14px; font-family:'Sora',sans-serif; font-weight:600; font-size:12px; cursor:pointer; margin-top:10px;}
  .addrow:hover{background:var(--blue-soft);}
  .delrow{background:#fff; border:1px solid var(--line); color:var(--red); border-radius:8px; width:30px; height:30px; cursor:pointer;}
  .submitreq{margin-top:18px; width:100%; cursor:pointer; border:none; border-radius:11px; padding:13px; font-family:'Sora',sans-serif; font-weight:600; font-size:14px; color:#fff; background:linear-gradient(145deg,var(--blue),var(--navy2)); box-shadow:0 6px 18px rgba(29,111,184,.3);}
  .submitreq:hover{transform:translateY(-1px);}
  .okbox{margin-top:16px; padding:14px 16px; background:#e7f6ee; border-radius:11px; font-size:13px; font-weight:600; color:var(--green); display:none;}
  .pmlist td{padding:9px 11px; border-bottom:1px solid var(--line2); font-size:12.5px;}
  .pmlist th{background:linear-gradient(180deg,var(--navy),var(--navy2)); color:#dce8f5; font-family:'Sora',sans-serif; font-weight:600; font-size:10.5px; letter-spacing:.4px; text-transform:uppercase; text-align:left; padding:11px;}
  .stbadge{font-size:10.5px; font-weight:700; padding:2px 9px; border-radius:6px;}
  .stbadge.draft{background:#eef2f7; color:var(--muted);} .stbadge.pending{background:var(--amber-soft); color:var(--amber-ink);} .stbadge.approved{background:#e7f6ee; color:var(--green);}
  .stat{display:flex; gap:12px; flex-wrap:wrap; margin-top:18px;}
  .stat>div{flex:1; min-width:120px; background:#fafcfe; border:1px solid var(--line2); border-radius:12px; padding:14px;}
  .stat .n{font-family:'Sora',sans-serif; font-size:22px; font-weight:700; color:var(--navy);}
  .stat .l{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .pipe{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:18px;}
  .pcard{background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; box-shadow:0 6px 20px rgba(13,37,69,.05); position:relative; overflow:hidden;}
  .pcard:before{content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--c,#1d6fb8);}
  .pcard .pn{font-family:'Sora',sans-serif; font-size:26px; font-weight:700; color:var(--navy); line-height:1;}
  .pcard .pl{font-size:11.5px; color:var(--muted); margin-top:5px; font-weight:600;}
  .pcard .pi{position:absolute; right:12px; top:12px; font-size:18px; opacity:.35; color:var(--c,#1d6fb8);}
  .pcard[data-pstatus]:hover{border-color:var(--c,#1d6fb8); transform:translateY(-1px);}
  .pcard.pcard-active{border:2px solid var(--c,#1d6fb8); background:#f3f8fd;}
  .pcard.pcard-active:before{width:6px;}
  @keyframes rise{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;}}
  @keyframes fadeUp{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
</style>
</head>

  function lowestIdxNZ(vs){
    var idx=-1, min=Infinity;
    vs.forEach(function(v,i){ if(v.a>0 && v.a<min){ min=v.a; idx=i; } });
    return idx;
  }
  function vBoxLM(R, tk, ti, vi){
    var v=tk.vendors[vi]; var li=lowestIdxNZ(tk.vendors);
    var cls='vbox'; var tag='';
    var isManager = current && current.role==='sr';
    var isLogistics = current && current.role==='lm';
    // Logistics can enter/edit quotes while requisition not yet sent
    if(isLogistics && !R.sent){
      return '<div class="vbox vinput"><input type="text" placeholder="Transporter name" value="'+(v.n||'')+'" data-vn="'+R.id+'|'+ti+'|'+vi+'">'+
        '<div class="amtwrap"><span class="cur">&#8377;</span><input type="number" placeholder="Quote" value="'+(v.a>0?v.a:'')+'" data-va="'+R.id+'|'+ti+'|'+vi+'"></div></div>';
    }
    if(tk.approved===vi){ cls+=' approved'; tag='<span class="vtag appr">&#10003; Approved by manager</span>'; }
    else if(tk.approved!==null){ /* another vendor approved on this truck */ }
    else if(vi===li){ cls+=' lowest'; tag='<span class="vtag low">Lowest quote</span>'; }
    var action='';
    if(isManager && R.sent && tk.approved===null){
      action='<button class="approve-btn" data-appr="'+R.id+'|'+ti+'|'+vi+'">Approve this transporter</button>';
    } else if(isManager && tk.approved===vi){
      action='<button class="approve-btn" data-unappr="'+R.id+'|'+ti+'" style="border-color:var(--line); color:var(--muted);">Undo approval</button>';
    }
    var nm = v.n || '<span style="color:var(--muted);">—</span>';
    var am = v.a>0 ? inr(v.a) : '<span style="color:var(--muted);">—</span>';
    return '<div class="'+cls+'"><div class="vn">'+nm+'</div><div class="va">'+am+'</div>'+tag+action+'</div>';
  }

  function reqStatus(R){
    var allApproved=R.trucks.every(function(t){return t.approved!==null;});
    if(R.sent && allApproved) return 'approved';
    if(R.sent) return 'pending';
    return 'draft';
  }
  var lmStatusFilter='';
  var srStatusFilter='';

  function pipeStats(){
    var totalReq=state.length, totalTrucks=0, draft=0, pendingReq=0, approvedReq=0, approvedTrucks=0;
    state.forEach(function(R){
      var qty=R.trucks.length; totalTrucks+=qty;
      var allApproved=R.trucks.every(function(t){return t.approved!==null;});
      R.trucks.forEach(function(t){ if(t.approved!==null) approvedTrucks++; });
      if(allApproved && R.sent) approvedReq++;
      else if(R.sent) pendingReq++;
      else draft++;
    });
    return {totalReq:totalReq, totalTrucks:totalTrucks, draft:draft, pendingReq:pendingReq, approvedReq:approvedReq, approvedTrucks:approvedTrucks};
  }
  function pcard(n,label,color,icon,pstatus){
    var clickable = pstatus ? ' data-pstatus="'+pstatus+'" style="--c:'+color+'; cursor:pointer;"' : ' style="--c:'+color+';"';
    var active = (pstatus && pstatus===lmStatusFilter) ? ' pcard-active' : '';
    return '<div class="pcard'+active+'"'+clickable+'><i class="ti '+icon+' pi"></i><div class="pn">'+n+'</div><div class="pl">'+label+'</div></div>';
  }
  function pipeLM(){

    function opts(sel,arr){arr.forEach(function(x){var o=document.createElement('option');o.value=x;o.textContent=x;sel.appendChild(o);});}

    function applyFilters(){

        var st=reqStatus(R);
        if(colOk){
          live.totalReq++; live.totalTrucks+=R.trucks.length;
          if(st==='draft') live.draft++; else if(st==='pending') live.pendingReq++; else live.approvedReq++;
        }
        var ok = colOk && (!lmStatusFilter || st===lmStatusFilter);
        document.querySelectorAll('tr[data-id="'+R.id+'"]').forEach(function(tr){ tr.style.display=ok?'':'none'; });
        if(ok) shown++;
      });
      document.getElementById('cnt').textContent=shown;
      document.getElementById('noresult').style.display=shown?'none':'block';
      var setN=function(sel,val){ var el=document.querySelector(sel); if(el) el.textContent=val; };
      setN('[data-pstatus="draft"] .pn', live.draft);
      setN('[data-pstatus="pending"] .pn', live.pendingReq);
      setN('[data-pstatus="approved"] .pn', live.approvedReq);
      var cards=document.querySelectorAll('.pipe .pcard');
      if(cards[0]) cards[0].querySelector('.pn').textContent=live.totalReq;
      if(cards[4]) cards[4].querySelector('.pn').textContent=live.totalTrucks;
    }
    document.querySelectorAll('[data-f]').forEach(function(el){ el.addEventListener('input',applyFilters); el.addEventListener('change',applyFilters); });
    document.querySelectorAll('[data-pstatus]').forEach(function(card){
      card.addEventListener('click', function(){
        var st=card.dataset.pstatus;
        lmStatusFilter = (lmStatusFilter===st) ? '' : st;
        document.querySelectorAll('[data-pstatus]').forEach(function(c){ c.classList.toggle('pcard-active', c.dataset.pstatus===lmStatusFilter); });
        applyFilters();
      });
    });
    document.getElementById('clearBtn').addEventListener('click', function(){
      document.querySelectorAll('[data-f]').forEach(function(el){el.value='';});
      lmStatusFilter='';
      document.querySelectorAll('[data-pstatus]').forEach(function(c){ c.classList.remove('pcard-active'); });
      applyFilters();
    });
    applyFilters();
  }

  function renderSenior(){
    var sent=state.filter(function(r){return r.sent;});
    var list=sent.filter(function(R){
      if(!srStatusFilter) return true;
      return reqStatus(R)===srStatusFilter;
    });
    var body='';
    if(list.length===0){
      var emptyMsg = sent.length===0 ? 'Nothing to approve yet. When Anil sends a requisition, it appears here.'
        : 'No requisitions in this view. Tap the active card again to see all sent requisitions.';
      body='<div class="panel"><h3>'+(srStatusFilter==='approved'?'Approved requisitions':'Pending approvals')+'</h3><p style="margin-top:10px;"><i class="ti ti-inbox" style="font-size:24px; display:block; margin-bottom:6px; opacity:.5;"></i>'+emptyMsg+'</p></div>';
    } else {
      list.forEach(function(R){
        var st=reqStatus(R);
        var statusChip = st==='approved'
          ? '<span style="margin-left:auto; font-size:11px; font-weight:600; padding:2px 10px; border-radius:999px; background:#e7f6ee; color:var(--green);">Approved</span>'
          : '<span style="margin-left:auto; font-size:11px; font-weight:600; padding:2px 10px; border-radius:999px; background:var(--amber-soft); color:var(--amber-ink);">Pending</span>';
        body+='<div class="card" style="margin-bottom:16px;"><div style="padding:14px 16px; border-bottom:1px solid var(--line2); display:flex; align-items:center; gap:10px; flex-wrap:wrap;">'+
          '<span class="reqno">'+R.id+'</span><span class="chip">'+R.branch+'</span>'+
          '<span style="font-size:12.5px; color:var(--muted);">'+R.size+' · '+R.proj+' · PM '+R.pm+'</span>'+statusChip+'</div>'+
          '<div style="padding:10px 16px; border-bottom:1px solid var(--line2); font-size:12.5px; color:var(--navy2); display:flex; gap:18px; flex-wrap:wrap;">'+
            '<span><i class="ti ti-map-pin" style="font-size:14px; vertical-align:-2px; margin-right:4px; color:var(--blue);"></i><b style="font-weight:600;">From:</b> '+R.from+'</span>'+
            '<span><i class="ti ti-flag" style="font-size:14px; vertical-align:-2px; margin-right:4px; color:var(--teal);"></i><b style="font-weight:600;">To:</b> '+R.to+'</span>'+
            '<span><i class="ti ti-calendar" style="font-size:14px; vertical-align:-2px; margin-right:4px; color:var(--muted);"></i>Reqd. '+fmt(R.date)+' · Unload '+fmt(R.unload)+'</span>'+
          '</div><div style="padding:14px 16px;">';
        R.trucks.forEach(function(tk,ti){
          var li=lowestIdx(tk.vendors); var done=tk.approved!==null;
          body+='<div style="margin-bottom:14px;"><div style="font-size:12.5px; font-weight:600; color:var(--navy2); margin-bottom:8px;">Truck '+(ti+1)+
            (done?' · <span style="color:var(--green);">approved: '+tk.vendors[tk.approved].n+' ('+inr(tk.vendors[tk.approved].a)+')</span>':' — select a transporter to approve')+'</div>'+
            '<div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:8px;">';
          tk.vendors.forEach(function(v,vi){
            var sel=(tk.approved===vi);
            var cls='vbox'+(sel?' approved':(vi===li?' lowest':''));
            body+='<div class="'+cls+'"><div class="vn">'+v.n+'</div><div class="va">'+inr(v.a)+'</div>'+
              (vi===li?'<span class="vtag low">Lowest</span>':'')+
              (sel?'<div class="vtag appr" style="display:block;">&#10003; Approved</div>':
                '<button class="approve-btn" data-appr="'+R.id+'|'+ti+'|'+vi+'">Approve this transporter</button>')+
              '</div>';
          });
          body+='</div></div>';
        });
        body+='</div></div>';
      });
    }
    var label = srStatusFilter==='approved' ? list.length+' approved requisition'+(list.length===1?'':'s')
      : srStatusFilter==='pending' ? list.length+' pending requisition'+(list.length===1?'':'s')
      : sent.length+' requisition'+(sent.length===1?'':'s')+' sent';
    document.getElementById('stage').innerHTML=
      pipeSR()+
      '<div class="toolbar"><span class="pill"><span class="dot"></span>'+label+'</span>'+
      (srStatusFilter?'<button class="btn btn-clear" id="srClear">&#10005; Show all sent</button>':'')+'</div>'+body;

    document.querySelectorAll('[data-sstatus]').forEach(function(card){
      card.addEventListener('click', function(){
        var st=card.dataset.sstatus;
        srStatusFilter = (srStatusFilter===st) ? '' : st;
        renderSenior();
      });
    });
    var srClear=document.getElementById('srClear');
    if(srClear) srClear.addEventListener('click', function(){ srStatusFilter=''; renderSenior(); });

    document.querySelectorAll('[data-appr]').forEach(function(b){
      b.addEventListener('click', function(){
        var p=b.dataset.appr.split('|'); var R=state.find(function(x){return x.id===p[0];});
        R.trucks[+p[1]].approved=+p[2]; saveState(); renderSenior();
      });
    });
  }

  function exportExcel(){
    var head=['Req. no.','Project manager','Branch','Truck required date','Truck size','Truck Qty','From location','To location','Unloading date','Project','Truck','Transporter1 Name','Transporter1 Quote','Transporter2 Name','Transporter2 Quote','Transporter3 Name','Transporter3 Quote','Status','Approved transporter','Approved amount'];
    var out=[head];
    state.forEach(function(R){
      var qty=R.trucks.length;
      R.trucks.forEach(function(tk,ti){
        var st = R.trucks.every(function(t){return t.approved!==null;}) ? 'Approved' : (R.sent?'Sent for approval':'Draft');
        var ap = tk.approved!==null ? tk.vendors[tk.approved].n : '';
        var aa = tk.approved!==null ? tk.vendors[tk.approved].a : '';
        out.push([R.id,R.pm,R.branch,fmt(R.date),R.size,qty,R.from,R.to,fmt(R.unload),R.proj,'Truck '+(ti+1),
          tk.vendors[0].n,tk.vendors[0].a,tk.vendors[1].n,tk.vendors[1].a,tk.vendors[2].n,tk.vendors[2].a, st, ap, aa]);
      });
    });
    var ws=XLSX.utils.aoa_to_sheet(out);
    ws['!cols']=[{wch:14},{wch:18},{wch:11},{wch:15},{wch:16},{wch:6},{wch:16},{wch:20},{wch:13},{wch:18},{wch:8},{wch:16},{wch:13},{wch:16},{wch:13},{wch:16},{wch:13},{wch:16},{wch:18},{wch:13}];
    var wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Requisitions');
    var d=new Date(), stamp=d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2);
    XLSX.writeFile(wb,'Insta_Truck_Requisitions_'+stamp+'.xlsx');
  }

  document.getElementById('loginBtn').addEventListener('click', login);
  document.getElementById('pass').addEventListener('keydown', function(e){ if(e.key==='Enter') login(); });
  document.getElementById('user').addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('pass').focus(); });
  document.getElementById('logoutBtn').addEventListener('click', logout);
  document.getElementById('exportBtn').addEventListener('click', exportExcel);

  function clock(){var d=new Date(); document.getElementById('clock').textContent=d.toLocaleDateString('en-GB')+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
  clock(); setInterval(clock,30000);

  window.addEventListener('storage', function(e){ if(e.key===STORE){ state=loadState(); renderStage(); } });
})();
</script>
</body>
</html>
