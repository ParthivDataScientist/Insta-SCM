// stable key for one piece so manual edits survive auto-regeneration
function pieceKey(orderId,tag,pieceIdx){ return `o${orderId}-${tag}-${pieceIdx}`; }

// USA combined client/order label: Project No + Client + Show Date + Show Name
function usaClientLabel(o){
  // Format: "CLIENT NAME  Project :#PROJNO - (SHOW DATE SHOW NAME)"
  const client = (o.clientName||'').toString().trim();
  const proj   = (o.projectNo||'').toString().trim();
  const showDt = (o.showDt||'').toString().trim();
  const showNm = (o.showName||'').toString().trim();
  let label = client;
  if(proj) label += `  Project :${proj}`;
  const inner = [showDt, showNm].filter(Boolean).join(' ');
  if(inner) label += ` - (${inner})`;
  return label.trim() || client || '(Unassigned)';
}

// Build the planning rows automatically from orders. Manual edits in planEdits override.
// If an order has detailed lineItems (from an uploaded order form) AND ships to USA,
// apply the USA mapping rules; otherwise fall back to the simple per-fabric pieces.
function buildPlanningRows(){
  const rows=[];
  getSortedOrders().forEach(o=>{
    const usa = isUSAShip(o.shipTo);
    const hasLines = Array.isArray(o.lineItems) && o.lineItems.length>0;

    if(hasLines && usa){
      const clientLabel = usaClientLabel(o);
      o.lineItems.forEach((li,liIdx)=>{
        const type = classifyLineType(li);
        const {nav,hsn} = navAndHsn(type);
        const itemNo = itemNoFor(type);
        const rate = rateFor(type);
        const qty = li.qty>0?li.qty:1;
        const perPieceRaw = qty>0 ? (li.sqm||0)/qty : 0;
        const perPieceSqm = Math.round(perPieceRaw);   // round to nearest whole m² (1.4→1, 1.6→2)
        const descParts=[li.graphicRef, li.printOn, li.goToFix].map(x=>(x||'').toString().trim()).filter(Boolean);
        const desc = descParts.join(' · ');
        for(let i=1;i<=qty;i++){
          const tag = `L${liIdx}p${i}`;
          const key = pieceKey(o.id,tag,i);
          const totalAmt = rate ? +(perPieceSqm*rate).toFixed(2) : '';
          const wpsm = weightPerSqmtr(itemNo);
          const actWt = wpsm ? +(wpsm*perPieceSqm).toFixed(4) : '';
          const base = {
            key, orderId:o.id, fabId:lineTypeToFab(type), pieceIdx:i,
            date: o.orderRecvDt || o.dispatchDt || '',
            client: clientLabel,
            shipTo: o.shipTo||'',
            hsn, navItem:nav, itemNo,
            description: desc || (li.printOn||''),
            visualSize: li.visualSize||'',
            qty: 1,
            qtySqmtr: perPieceSqm,
            uom: 'SQMTR',
            rate: rate || '', totalAmt,
            actualWeight:actWt, netWt:'', grWt:'',
            boxNo:'', dimension:'', awb:'', invoiceNo:'', freight:'', shipmentType:'',
          };
          const ov = planEdits[key];
          rows.push(ov ? {...base, ...ov, key, orderId:o.id, pieceIdx:i} : base);
        }
      });
      return;
    }

    // fallback: simple per-fabric pieces (manual orders or non-USA / no line detail)
    const clientLabel = (usa ? usaClientLabel(o) : (o.clientName + (o.orderNo?(' '+o.orderNo):'')));
    FAB_TYPES.forEach(f=>{
      const qty = o[f.id]||0;
      if(qty<=0) return;
      const totalSqm = o[f.id+'Sqm']||0;
      const perPieceSqm = qty>0 ? totalSqm/qty : 0;
      const map = usa ? navAndHsn(f.id==='white'?'white':(f.id==='backlit'?'backlit':(f.id==='vinyl'?'vinyl':'nonlit'))) : {nav:'',hsn:''};
      const itemNo = usa ? itemNoFor(f.id==='white'?'white':f.id) : '';
      for(let i=1;i<=qty;i++){
        const key = pieceKey(o.id,f.id,i);
        const base = {
          key, orderId:o.id, fabId:f.id, pieceIdx:i,
          date: o.orderRecvDt || o.dispatchDt || '',
          client: clientLabel,
          shipTo: o.shipTo||'',
          hsn: map.hsn, navItem: map.nav, itemNo,
          description: `${f.name} — piece ${i} of ${qty}`,
          visualSize: '',
          qty: 1,
          qtySqmtr: perPieceSqm ? +perPieceSqm.toFixed(4) : 0,
          uom: 'SQMTR',
          rate: '', totalAmt: '',
          actualWeight:'', netWt:'', grWt:'',
          boxNo:'', dimension:'', awb:'', invoiceNo:'', freight:'', shipmentType:'',
        };
        const ov = planEdits[key];
        rows.push(ov ? {...base, ...ov, key, orderId:o.id, fabId:f.id, pieceIdx:i} : base);
      }
    });
  });
  return rows;
}

function planRowMatches(r){
  // date filter: planDateFilter is yyyy-mm-dd from <input type=date>; r.date is dd.mm.yyyy or similar
  if(planDateFilter){
    const d=(r.date||'').toString();
    // normalize r.date dd.mm.yyyy -> yyyy-mm-dd for compare
    const m=d.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})/);
    let iso='';
    if(m){ const yr=m[3].length===2?('20'+m[3]):m[3]; iso=`${yr}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
    else { const m2=d.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m2) iso=m2[0]; }
    if(iso!==planDateFilter) return false;
  }
  if(planSearch){
    const q=planSearch.toLowerCase();
    const hay=[r.client,r.shipTo,r.hsn,r.navItem,r.itemNo,r.description,r.visualSize,r.awb,r.invoiceNo,r.boxNo].map(x=>(x==null?'':String(x))).join(' ').toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

function setPlanSearch(v){ planSearch=v; renderPlanningTab(true); }
function setPlanDate(v){ planDateFilter=v; renderPlanningTab(); }
function clearPlanFilters(){ planSearch=''; planDateFilter=''; renderPlanningTab(); }
function expandAllPlanGroups(keys){ keys.forEach(k=>planExpandedGroups[k]=true); renderPlanningTab(); }
function collapseAllPlanGroups(keys){ keys.forEach(k=>planExpandedGroups[k]=false); renderPlanningTab(); }

function renderPlanningTab(keepSearchFocus){
  const allRows = buildPlanningRows();   // always fresh from orders
  planningRows = allRows;
  const rowsFiltered = allRows.filter(planRowMatches);
  const groups={};
  rowsFiltered.forEach(r=>{const k=planGroupKey(r);(groups[k]=groups[k]||[]).push(r);});
  const keys=Object.keys(groups).sort();
  const allKeys=[...new Set(allRows.map(planGroupKey))];
  const filtering = !!(planSearch||planDateFilter);

  const filterBar=`
    <div class="toolbar" style="flex-wrap:wrap;gap:8px;">
      <input id="plan-search" type="text" placeholder="🔍 Search client, item code, description…" value="${esc(planSearch)}"
        oninput="setPlanSearch(this.value)" style="flex:1;min-width:200px;padding:6px 10px;border:1px solid #D8D8D6;border-radius:7px;font-size:13px;">
      <input id="plan-date" type="date" value="${esc(planDateFilter)}" onchange="setPlanDate(this.value)" title="Filter by date"
        style="padding:5px 8px;border:1px solid #D8D8D6;border-radius:7px;font-size:13px;">
      ${filtering?`<button class="btn btn-sm" onclick="clearPlanFilters()">✕ Clear</button>`:''}
      <button class="btn btn-sm" onclick="expandAllPlanGroups(${JSON.stringify(allKeys).replace(/"/g,'&quot;')})">▼ Expand all</button>
      <button class="btn btn-sm" onclick="collapseAllPlanGroups(${JSON.stringify(allKeys).replace(/"/g,'&quot;')})">▶ Collapse all</button>
    </div>`;

  const toolbar=`
    <div class="toolbar">
      <span style="font-size:12px;color:#5A5A57;">📋 Auto-generated from orders — one row per piece. ${isMgr()?'Click any highlighted cell to edit; edits are saved and kept on refresh.':'View only.'}</span>
      ${allRows.length?`<button class="btn" style="margin-left:auto;" onclick="exportPlanning()">📤 Export Planning</button>`:'<span style="margin-left:auto;"></span>'}
      ${isMgr()&&Object.keys(planEdits).length?`<button class="btn btn-danger" onclick="resetPlanEdits()">↺ Reset edits</button>`:''}
      <span style="font-size:11px;color:#888;">${rowsFiltered.length}${filtering?(' / '+allRows.length):''} piece(s) · ${keys.length} order group(s)</span>
    </div>`;

  if(!allRows.length){
    document.getElementById('tab-content').innerHTML=toolbar+
      `<div style="padding:48px;text-align:center;color:#9A9A97;background:#fff;border:1px dashed #D8D8D6;border-radius:12px;">
        <div style="font-size:32px;margin-bottom:8px;">📋</div>
        <div style="font-size:14px;font-weight:600;color:#5A5A57;">No pieces to plan yet</div>
        <div style="font-size:12px;margin-top:4px;">Add an order (with fabric quantities) and its pieces will appear here automatically.</div>
      </div>`;
    return;
  }

  if(!rowsFiltered.length){
    document.getElementById('tab-content').innerHTML=toolbar+filterBar+
      `<div style="padding:36px;text-align:center;color:#9A9A97;background:#fff;border:1px dashed #D8D8D6;border-radius:12px;">
        <div style="font-size:14px;font-weight:600;color:#5A5A57;">No pieces match your filter</div>
        <div style="font-size:12px;margin-top:4px;">Try a different search term or date, or clear the filters.</div>
      </div>`;
    restorePlanSearchFocus(keepSearchFocus);
    return;
  }

  const headCells=PLAN_FIELDS.map(f=>`<th style="min-width:${f.w};">${f.label}</th>`).join('');
  const groupsHtml=keys.map(k=>{
    const rows=groups[k];
    // when filtering, default to expanded so matches are visible
    const expanded=filtering?true:(planExpandedGroups[k]!==false);
    const sumQty=rows.reduce((a,r)=>a+planNum(r.qty),0);
    const sumSqm=rows.reduce((a,r)=>a+planNum(r.qtySqmtr),0);
    const sumAmt=rows.reduce((a,r)=>a+planNum(r.totalAmt),0);
    const body=rows.map(r=>`<tr>
      ${PLAN_FIELDS.map(f=>{
        let v=r[f.k];
        let disp=(f.num&&(v||v===0)&&v!=='')?planNum(v).toLocaleString('en-IN',{maximumFractionDigits:2}):(v??'');
        if(isMgr()&&f.edit){
          return `<td${f.num?' style="text-align:right;"':''} class="plan-edit"
            contenteditable="true" data-key="${r.key}" data-field="${f.k}"
            onblur="planCellEdit(this)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}"
            >${esc(String(disp))}</td>`;
        }
        return `<td${f.num?' style="text-align:right;"':''}>${esc(String(disp))}</td>`;
      }).join('')}
    </tr>`).join('');
    return `
      <div class="col-panel" style="padding:0;overflow:hidden;">
        <div onclick="togglePlanGroup('${k.replace(/'/g,"\\'")}')" style="cursor:pointer;display:flex;align-items:center;gap:10px;padding:11px 14px;background:#EEEDFC;border-bottom:1px solid #D8D8D6;">
          <span style="font-size:12px;color:#4A3FB5;">${expanded?'▼':'▶'}</span>
          <span style="font-weight:600;font-size:13px;flex:1;">${esc(k)}</span>
          <span style="font-size:11px;color:#5A5A57;">${rows.length} piece(s) · ${sumSqm.toLocaleString('en-IN',{maximumFractionDigits:2})} m²${sumAmt?(' · Amt '+sumAmt.toLocaleString('en-IN',{maximumFractionDigits:2})):''}</span>
        </div>
        ${expanded?`<div class="tbl-wrap" style="border:none;border-radius:0;box-shadow:none;">
          <table style="min-width:100%;">
            <thead><tr>${headCells}</tr></thead>
            <tbody>${body}</tbody>
          </table></div>`:''}
      </div>`;
  }).join('');

  document.getElementById('tab-content').innerHTML=toolbar+filterBar+groupsHtml;
  restorePlanSearchFocus(keepSearchFocus);
}

function restorePlanSearchFocus(keep){
  if(!keep) return;
  const el=document.getElementById('plan-search');
  if(el){ el.focus(); const v=el.value; el.value=''; el.value=v; }  // move caret to end
}

function togglePlanGroup(k){ planExpandedGroups[k]=planExpandedGroups[k]===false?true:false; renderPlanningTab(); }

// save a manual cell edit into planEdits (keyed by piece + field)
function planCellEdit(td){
  const key=td.getAttribute('data-key');
  const field=td.getAttribute('data-field');
  const fieldDef=PLAN_FIELDS.find(f=>f.k===field);
  let val=td.textContent.trim();
  if(fieldDef.num) val = val===''? '' : planNum(val.replace(/,/g,''));
  if(!planEdits[key]) planEdits[key]={};
  planEdits[key][field]=val;
  saveLocal();
  // refresh totals (re-render) so group sums update
  renderPlanningTab();
}

function resetPlanEdits(){
  if(!confirm('Clear all manual edits and regenerate planning from orders?'))return;
  planEdits={};saveLocal();renderPlanningTab();
  showToast('↺ Planning edits reset');
}

function exportPlanning(){
  const data=buildPlanningRows();
  const cols=PLAN_FIELDS.map(f=>f.label);
  const aoaRows=data.map(r=>PLAN_FIELDS.map(f=>{
    let v=r[f.k];
    if(f.num){ const n=parseFloat(v); return isNaN(n)? '' : n; }   // numbers stay numeric
    return (v==null?'':v);
  }));
  const fileName='OrderPlanning_'+new Date().toISOString().slice(0,10)+'.xlsx';

  // auto-fit width per column = max content length (clamped)
  const widths=cols.map((c,ci)=>{
    let w=String(c).length;
    aoaRows.forEach(row=>{ const s=String(row[ci]==null?'':row[ci]); if(s.length>w) w=s.length; });
    return Math.min(Math.max(w+2,6),48);   // +2 padding, min 6, max 48
  });

  if(typeof ExcelJS!=='undefined'){
    const wbk=new ExcelJS.Workbook();
    const sh=wbk.addWorksheet('Order planning',{views:[{state:'frozen',ySplit:1}]});
    const thin={top:{style:'thin',color:{argb:'FFBFBFBF'}},left:{style:'thin',color:{argb:'FFBFBFBF'}},bottom:{style:'thin',color:{argb:'FFBFBFBF'}},right:{style:'thin',color:{argb:'FFBFBFBF'}}};
    const headFill={type:'pattern',pattern:'solid',fgColor:{argb:'FFD9D9D9'}};
    sh.columns=cols.map((c,i)=>({header:c,width:widths[i]}));
    sh.getRow(1).eachCell(cell=>{
      cell.font={bold:true,color:{argb:'FF1A1A18'}};
      cell.fill=headFill;
      cell.alignment={vertical:'middle',horizontal:'center',wrapText:true};
      cell.border=thin;
    });
    sh.getRow(1).height=20;
    aoaRows.forEach(rowVals=>{
      const row=sh.addRow(rowVals);
      row.eachCell({includeEmpty:true},cell=>{ cell.border=thin; cell.alignment={vertical:'middle'}; });
    });
    wbk.xlsx.writeBuffer().then(buf=>{
      const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download=fileName; a.click(); URL.revokeObjectURL(url);
      showToast('✓ Planning exported (with borders)');
    }).catch(err=>{ alert('Export failed: '+err.message); });
    return;
  }

  // Fallback: SheetJS (no borders)
  const ws=XLSX.utils.aoa_to_sheet([cols,...aoaRows]);
  ws['!cols']=widths.map(w=>({wch:w}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Order planning');
  XLSX.writeFile(wb,fileName);
  showToast('✓ Planning exported');
}

// Press Esc to close any open modal/window
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    const m=document.getElementById('modal-area');
    if(m && m.innerHTML.trim()) closeModal();
  }
});
renderLogin();
</script>
